<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="auto">
  <defs>
    <linearGradient id="term-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <filter id="term-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
  </style>

  <!-- Terminal Window Background -->
  <rect width="960" height="480" rx="14" fill="url(#term-bg)" stroke="#334155" stroke-width="1.2" filter="url(#term-shadow)" />

  <!-- Window Header -->
  <rect width="960" height="38" rx="14" fill="#1e293b" fill-opacity="0.75" />
  <line x1="0" y1="38" x2="960" y2="38" stroke="#334155" stroke-width="1" />

  <!-- Window Controls -->
  <circle cx="24" cy="19" r="6" fill="#ef4444" />
  <circle cx="44" cy="19" r="6" fill="#eab308" />
  <circle cx="64" cy="19" r="6" fill="#22c55e" />

  <!-- Terminal Title -->
  <text x="480" y="24" fill="#94a3b8" font-size="12" font-weight="500" text-anchor="middle" class="mono">goodgirl test all — 6 passed (755ms)</text>

  <!-- Terminal Body Content -->
  <g transform="translate(32, 68)" class="mono" font-size="13" line-height="1.5">
    <!-- Prompt Line -->
    <text x="0" y="0" fill="#38bdf8" font-weight="600">$</text>
    <text x="16" y="0" fill="#f8fafc" font-weight="600">goodgirl test all</text>

    <!-- Execution Start -->
    <text x="0" y="28" fill="#38bdf8">🚀 Starting GoodGirl ALL test suite...</text>
    <text x="0" y="52" fill="#64748b">Running 6 tests using 2 workers</text>

    <!-- Test Rows -->
    <g transform="translate(0, 78)">
      <text x="0" y="0" fill="#10b981">✔</text>
      <text x="18" y="0" fill="#94a3b8">[api]</text>
      <text x="65" y="0" fill="#e2e8f0">GET /api/health returns 200 and conforms to health schema</text>
      <text x="590" y="0" fill="#64748b">(21ms)</text>

      <text x="0" y="22" fill="#10b981">✔</text>
      <text x="18" y="22" fill="#94a3b8">[api]</text>
      <text x="65" y="22" fill="#e2e8f0">GET /api/users returns 200 and list of test users</text>
      <text x="590" y="22" fill="#64748b">(6ms)</text>

      <text x="0" y="44" fill="#10b981">✔</text>
      <text x="18" y="44" fill="#94a3b8">[api]</text>
      <text x="65" y="44" fill="#e2e8f0">POST /api/items creates item and returns 201 on valid body</text>
      <text x="590" y="44" fill="#64748b">(4ms)</text>

      <text x="0" y="66" fill="#10b981">✔</text>
      <text x="18" y="66" fill="#94a3b8">[api]</text>
      <text x="65" y="66" fill="#e2e8f0">POST /api/items returns 400 validation error on empty payload</text>
      <text x="590" y="66" fill="#64748b">(5ms)</text>

      <text x="0" y="88" fill="#10b981">✔</text>
      <text x="18" y="88" fill="#94a3b8">[e2e]</text>
      <text x="65" y="88" fill="#e2e8f0">homepage loads successfully and displays expected heading</text>
      <text x="590" y="88" fill="#64748b">(141ms)</text>

      <text x="0" y="110" fill="#10b981">✔</text>
      <text x="18" y="110" fill="#94a3b8">[e2e]</text>
      <text x="65" y="110" fill="#e2e8f0">user interaction triggers action and updates status message</text>
      <text x="590" y="110" fill="#64748b">(138ms)</text>
    </g>

    <!-- Summary Box Card -->
    <g transform="translate(0, 220)">
      <rect width="896" height="154" rx="8" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
      <line x1="0" y1="36" x2="896" y2="36" stroke="#1e293b" stroke-width="1" />

      <text x="18" y="24" fill="#f8fafc" font-size="13" font-weight="700">GoodGirl Test Execution Summary</text>
      
      <text x="18" y="62" fill="#64748b">Overall Status:</text>
      <rect x="140" y="48" width="84" height="20" rx="4" fill="#065f46" fill-opacity="0.5" stroke="#10b981" stroke-width="0.8" />
      <text x="182" y="63" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">✔ PASSED</text>

      <text x="18" y="90" fill="#64748b">Total Tests:</text>
      <text x="140" y="90" fill="#f8fafc" font-weight="600">6</text>
      <text x="175" y="90" fill="#10b981">(6 passed, 0 failed, 0 skipped)</text>

      <text x="18" y="116" fill="#64748b">Duration:</text>
      <text x="140" y="116" fill="#f8fafc">754.8ms</text>

      <text x="18" y="140" fill="#64748b">Artifacts:</text>
      <text x="140" y="140" fill="#38bdf8">goodgirl-results/html/index.html</text>
      <text x="410" y="140" fill="#64748b">•</text>
      <text x="428" y="140" fill="#818cf8">goodgirl-results/results.json</text>
    </g>
  </g>
</svg>
