name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Check code formatting & lint
        run: pnpm lint

      - name: Check TypeScript types
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Install Playwright browsers (Linux)
        if: runner.os == 'Linux'
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Install Playwright browsers (Windows & macOS)
        if: runner.os != 'Linux'
        run: pnpm exec playwright install chromium firefox webkit

      - name: Setup Grafana k6
        uses: grafana/setup-k6-action@v1

      - name: Pull OWASP ZAP Docker image (Linux)
        if: runner.os == 'Linux'
        run: docker pull ghcr.io/zaproxy/zaproxy:bare

      - name: Run GoodGirl doctor check
        run: pnpm qa doctor

      - name: Run GoodGirl load doctor check
        run: pnpm qa load doctor

      - name: Run GoodGirl security doctor check (Linux)
        if: runner.os == 'Linux'
        run: pnpm qa security doctor

      - name: Run GoodGirl security doctor check (Windows & macOS)
        if: runner.os != 'Linux'
        continue-on-error: true
        run: pnpm qa security doctor

      - name: Verify GoodGirl security CLI commands
        run: |
          pnpm qa security --help
          pnpm qa security baseline --help
          pnpm qa security api --help
          pnpm qa security run --help
          pnpm qa security report --help

      - name: Run GoodGirl test suite
        run: pnpm qa test all

      - name: Run sample project test suite
        run: pnpm --filter sample-project test

      - name: Run k6 smoke performance test
        run: pnpm qa load run examples/k6/smoke.js

      - name: Run OWASP ZAP passive baseline scan (Linux)
        if: runner.os == 'Linux'
        run: pnpm qa security baseline --target http://127.0.0.1:4173 --docker-image ghcr.io/zaproxy/zaproxy:bare

      - name: Verify OWASP ZAP report inspection (Linux)
        if: runner.os == 'Linux'
        run: |
          pnpm qa security report
          pnpm qa security report --format json

      - name: Verify ZAP CLI diagnostics fallback (Windows & macOS)
        if: runner.os != 'Linux'
        continue-on-error: true
        run: pnpm qa security baseline --target http://127.0.0.1:4173

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ matrix.os }}
          path: |
            goodgirl-results/
            examples/sample-project/goodgirl-results/
          retention-days: 7
