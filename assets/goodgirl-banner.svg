<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0d1424" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Ambient Glow Left (Cyan) -->
    <radialGradient id="glow-cyan" cx="15%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- Ambient Glow Right (Indigo) -->
    <radialGradient id="glow-indigo" cx="85%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <!-- Center Accent Glow -->
    <radialGradient id="glow-center" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>

    <!-- Wordmark Gradient -->
    <linearGradient id="wordmark-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f8fafc" />
      <stop offset="75%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Badge Gradient -->
    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Subtle Card Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.7" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
    </pattern>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    .font-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Canvas Outer Background -->
  <rect width="1200" height="420" rx="18" fill="url(#bg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Grid Overlay -->
  <rect width="1200" height="420" rx="18" fill="url(#grid)" />

  <!-- Ambient Light Effects -->
  <rect width="1200" height="420" fill="url(#glow-cyan)" rx="18" />
  <rect width="1200" height="420" fill="url(#glow-indigo)" rx="18" />
  <rect width="1200" height="420" fill="url(#glow-center)" rx="18" />

  <!-- Top Window Bar Header -->
  <g transform="translate(40, 32)">
    <!-- Window Controls -->
    <circle cx="10" cy="10" r="6" fill="#ef4444" fill-opacity="0.85" />
    <circle cx="30" cy="10" r="6" fill="#eab308" fill-opacity="0.85" />
    <circle cx="50" cy="10" r="6" fill="#22c55e" fill-opacity="0.85" />

    <!-- Terminal Breadcrumb Pill -->
    <rect x="76" y="-2" width="230" height="24" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="92" y="14" fill="#94a3b8" font-size="11" class="font-mono">goodgirl-cli --qa-engine</text>

    <!-- Version Pill Right -->
    <rect x="1040" y="-2" width="80" height="24" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.6" />
    <circle cx="1054" cy="10" r="3.5" fill="#38bdf8" />
    <text x="1064" y="14" fill="#38bdf8" font-size="11" font-weight="600" class="font-mono">v0.1.0</text>
  </g>

  <!-- Divider Line -->
  <line x1="40" y1="74" x2="1160" y2="74" stroke="#1e293b" stroke-width="1" stroke-opacity="0.8" />

  <!-- Main Hero Brand Area -->
  <g transform="translate(60, 110)">
    <!-- Terminal Prompt Symbol Badge -->
    <rect x="0" y="4" width="76" height="76" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" />
    <path d="M 22 28 L 36 42 L 22 56" fill="none" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="42" y1="56" x2="56" y2="56" stroke="#818cf8" stroke-width="4.5" stroke-linecap="round" />

    <!-- Wordmark & Pill -->
    <g transform="translate(96, 0)">
      <text x="0" y="60" fill="url(#wordmark-grad)" font-size="64" font-weight="900" letter-spacing="1.5" class="font-sans">GOODGIRL</text>
      
      <!-- CLI Pill -->
      <rect x="408" y="16" width="72" height="44" rx="10" fill="url(#badge-grad)" />
      <text x="444" y="46" fill="#ffffff" font-size="20" font-weight="800" text-anchor="middle" letter-spacing="1" class="font-mono">CLI</text>
    </g>

    <!-- Tagline -->
    <text x="98" y="104" fill="#cbd5e1" font-size="22" font-weight="500" class="font-sans">
      One CLI. Three powerful testing engines.
    </text>
    <text x="98" y="132" fill="#64748b" font-size="14.5" class="font-sans">
      Cross-platform QA automation toolkit engineered for Windows PowerShell, macOS, and Linux.
    </text>
  </g>

  <!-- Engine Architecture Indicator Cards -->
  <g transform="translate(60, 290)">
    <!-- Card 1: Playwright (Implemented) -->
    <g transform="translate(0, 0)">
      <rect width="338" height="90" rx="12" fill="url(#card-grad)" stroke="#0ea5e9" stroke-width="1.2" stroke-opacity="0.7" filter="url(#shadow)" />
      <!-- Indicator Dot -->
      <circle cx="28" cy="30" r="5" fill="#10b981" />
      <circle cx="28" cy="30" r="8" fill="#10b981" fill-opacity="0.2" />
      <text x="44" y="35" fill="#f8fafc" font-size="16" font-weight="700" class="font-sans">Playwright Engine</text>
      <text x="44" y="56" fill="#94a3b8" font-size="12" class="font-sans">Functional, E2E &amp; REST API Testing</text>
      <!-- Status Badge -->
      <rect x="44" y="66" width="92" height="18" rx="9" fill="#065f46" fill-opacity="0.5" stroke="#10b981" stroke-width="0.8" />
      <text x="90" y="79" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle" class="font-mono">IMPLEMENTED</text>
    </g>

    <!-- Card 2: Grafana k6 (Planned) -->
    <g transform="translate(370, 0)">
      <rect width="338" height="90" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1" stroke-opacity="0.8" filter="url(#shadow)" />
      <!-- Indicator Dot -->
      <circle cx="28" cy="30" r="5" fill="#f59e0b" />
      <text x="44" y="35" fill="#e2e8f0" font-size="16" font-weight="700" class="font-sans">Grafana k6 Engine</text>
      <text x="44" y="56" fill="#64748b" font-size="12" class="font-sans">Performance, Spike &amp; Load Testing</text>
      <!-- Status Badge -->
      <rect x="44" y="66" width="82" height="18" rx="9" fill="#78350f" fill-opacity="0.3" stroke="#d97706" stroke-width="0.8" stroke-opacity="0.6" />
      <text x="85" y="79" fill="#fbbf24" font-size="10" font-weight="700" text-anchor="middle" class="font-mono">PHASE 3</text>
    </g>

    <!-- Card 3: OWASP ZAP (Planned) -->
    <g transform="translate(740, 0)">
      <rect width="340" height="90" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1" stroke-opacity="0.8" filter="url(#shadow)" />
      <!-- Indicator Dot -->
      <circle cx="28" cy="30" r="5" fill="#8b5cf6" />
      <text x="44" y="35" fill="#e2e8f0" font-size="16" font-weight="700" class="font-sans">OWASP ZAP Engine</text>
      <text x="44" y="56" fill="#64748b" font-size="12" class="font-sans">Security Baseline &amp; Vulnerability</text>
      <!-- Status Badge -->
      <rect x="44" y="66" width="82" height="18" rx="9" fill="#4c1d95" fill-opacity="0.3" stroke="#8b5cf6" stroke-width="0.8" stroke-opacity="0.6" />
      <text x="85" y="79" fill="#c084fc" font-size="10" font-weight="700" text-anchor="middle" class="font-mono">PHASE 4</text>
    </g>
  </g>
</svg>
